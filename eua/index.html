<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imóveis nos EUA · Converse com a Eve</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Imóveis nos EUA: converse com a Eve">
<meta property="og:description" content="Entradas VIP por indicação para a imersão de 12 e 13/12 em SP.">
<meta property="og:image" content="https://simbiosedigital.com.br/og.png?v=2">
<meta property="og:url" content="https://simbiosedigital.com.br/eua/">
<link rel="icon" href="/favicon.svg">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#01004A;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:16px}
  a{color:#FF6600;font-weight:700}
</style>
<script>
  // Destino: WhatsApp da Eve com a mensagem pronta (a Simbi reconhece "vim pelo Legacy").
  var origem = new URLSearchParams(location.search).get("de") || "legacy";
  var destino = "https://wa.me/5511973995936?text=" + encodeURIComponent("Oi Eve, vim pelo Legacy e quero entender o caminho para investir nos EUA");
  // Contagem de cliques (GoatCounter): passa a funcionar quando a conta "simbiosedigital" for criada.
  window.goatcounter = { no_onload: true };
  function ir(){ location.replace(destino); }
  window.addEventListener("load", function(){
    try { window.goatcounter.count({ path: "eua-" + origem, title: "Link EUA (" + origem + ")" }); } catch(e) {}
    setTimeout(ir, 500);
  });
  setTimeout(ir, 2500);
</script>
<script async src="https://gc.zgo.at/count.js" data-goatcounter="https://simbiosedigital.goatcounter.com/count"></script>
</head>
<body>
  <p>Abrindo o WhatsApp da Eve…<br><br><a id="l" href="https://wa.me/5511973995936">Toque aqui se não abrir</a></p>
  <script>document.getElementById("l").href = destino;</script>
</body>
</html>
